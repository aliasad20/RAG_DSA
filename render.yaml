services:
  - type: web
    name: dsa-lecture-answers
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: python -m uvicorn ytrag.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
